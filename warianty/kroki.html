<style>
.vj-nr { display: grid; place-items: center; border-radius: 50%; background: var(--akcent); color: var(--tekst-mocny); font: 700 calc(var(--fs) * var(--u))/1 var(--font-naglowki); box-shadow: 0 0 0 calc(5 * var(--u)) var(--biel); }

  box-shadow: inset 0 calc(-4 * var(--u)) 0 rgb(0 0 0 / .18), 0 calc(8 * var(--u)) calc(14 * var(--u)) calc(-6 * var(--u)) rgb(0 0 0 / .4); }

.vj-60 svg { width: 40%; height: auto; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; }

/* Para nad okienkiem parowym w kroku „Podgrzej” (17.10, audyt R2-48 i R2-50): trzy kłęby z r2/skladniki w jednym miejscu,
   wznoszą się i gasną z przesuniętą fazą jak .para w components.css, ale wyraźniej. Lekki granatowy cień daje bieli
   kontur na jasnej pokrywie i kremowym tle, bez niego para znika. Bez ruchu: jeden kłąb stoi nieruchomo.
   Wznoszenie przycięte (poprawka R2-50): najwyższy widoczny piksel pary zostaje co najmniej 12 px pod literami h2 na 1440 i 1024. */
#jak-korzystac .vj-para { pointer-events: none; aspect-ratio: 1 / 1.9; }
#jak-korzystac .vj-para img { position: absolute; left: 50%; bottom: 0; width: 62%; height: auto; opacity: 0; translate: -50% 0; transform-origin: 50% 100%;
  filter: drop-shadow(0 0 calc(3 * var(--u)) rgb(10 42 94 / .32)); animation: vj-para 6s linear infinite; }
#jak-korzystac .vj-para img:nth-child(1) { animation-delay: -.5s; }
#jak-korzystac .vj-para img:nth-child(2) { left: 42%; width: 56%; animation-delay: -2.5s; }
#jak-korzystac .vj-para img:nth-child(3) { left: 58%; width: 58%; animation-delay: -4.5s; }
@keyframes vj-para {
  0%   { opacity: 0;   transform: translateY(8%) scale(.9, .86); }
  22%  { opacity: .9; }
  62%  { opacity: .7; }
  100% { opacity: 0;   transform: translateY(-1%) scale(1, .95); }
}
@media (prefers-reduced-motion: reduce) {
  #jak-korzystac .vj-para img { animation: none; }
  #jak-korzystac .vj-para img:first-child { opacity: .85; transform: translateY(4%) scale(.95, .9); }
}
/* TELEFON (17.10): wariant 2 „Kółka i przedmioty” na płótnie 390, kroki jeden pod drugim: kółko po lewej, opis po prawej */
/* Styl pliku trafia do <head> całej strony, więc każda reguła siedzi pod #jak-korzystac: bez tego balance nagłówków
   i ramka odznaki zasilania przechodziły na sekcje sposób, parametry, modele i B2B. */
@media (max-width: 899px) {
  #jak-korzystac .vk--m h2.t-h { text-wrap: balance; }
  #jak-korzystac .vk--m .vj-krok.c { text-align: left; }

  #jak-korzystac .vk--m .vj-nr { box-shadow: 0 0 0 calc(3.5 * var(--u)) var(--biel); }

  #jak-korzystac .vk--m .vj-para { transform-origin: 50% 100%; }
  /* --ms z warianty-sekcji.js nie dochodzi do .odznaka (reset --ms na potomkach .odz), rozmiar odznaki ustawiamy wprost */
  #jak-korzystac .vk--m .odz[style*="--ms"] > .odznaka.odznaka--zasilanie { --w: calc(64 * var(--u)); }
  #jak-korzystac .vk--m .odznaka--zasilanie .odznaka__plytka { padding-inline: calc(1 * var(--u)); border-width: calc(2.5 * var(--u)); }
  #jak-korzystac .vk--m .odznaka--zasilanie .odznaka__plytka small { font-size: calc(var(--w) * .155); overflow-wrap: normal; word-break: normal; }
}
</style>
